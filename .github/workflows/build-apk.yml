# Builds the patched XVirtualCamera module on GitHub, so no Android SDK is needed locally.
# UNTESTED: written against the upstream build files (AGP 8.1.2, Gradle 8.0, ndkBuild), not run.
#
# Use: fork https://github.com/sandyz987/XVirtualCamera, apply
# xvirtualcamera-jetscooters.patch to your fork (git apply, commit, push), copy this file to
# .github/workflows/build-apk.yml in the fork, push, then open the Actions tab and download
# the "XVirtualCamera-phonebridge" artifact.
name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licences (lets Gradle fetch the NDK it wants)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: XVirtualCamera-phonebridge
          path: app/build/outputs/apk/debug/*.apk
